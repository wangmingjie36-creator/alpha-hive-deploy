name: tests

# 只跑**离线确定性**子集（`-m "not integration and not network"`）。
#
# 为什么不跑全量：本仓库有一批测试打真实外部 API（yfinance / Treasury / CNN）。
# 它们在用户 Mac 上是绿的，但放进 CI 就成了噪音源——Yahoo 限流、
# 端点改版、runner 出口 IP 被限速，任何一样都会让 CI 无故转红。
# 而一个时红时绿的 CI 比没有 CI 更糟：它训练所有人忽略红灯，
# 真出问题时没人看。所以这里只保留「同样输入必然同样结果」的那部分。
#
# 跑被排除的那些：本机 `pytest -m network` / `pytest -m integration`。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # 同一分支上新的推送取消尚未跑完的旧运行，省 runner 也避免看错版本的结果
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与生产扫描一致（用户 Mac 上是 Homebrew 3.11.1）。
          # 3.9 会直接崩：本仓库用了 PEP604 的 `X | None` 注解。
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest / pytest-timeout / ruff 是纯测试依赖，刻意不写进 requirements.txt
          # （那是生产依赖清单，扫描进程不该为跑测试装东西）
          #
          # ruff 不装的话 test_no_undefined_names.py 会整体 skip —— 那正是它
          # 存在前的状态（"本仓库早已装好并配置了 ruff，只是没人跑"）。
          # F821 守卫治的是「异常分支里的 NameError」这类只在生产触发的 bug，
          # 在 CI 里跳过它等于把这个守卫又关回去。
          pip install -r requirements.txt pytest pytest-timeout ruff

      - name: Run offline-deterministic tests
        run: |
          # --maxfail=0 覆盖 pyproject addopts 里的 `-x`：CI 要一次看全所有失败，
          # 而不是撞到第一个就停（本地开发才需要 `-x` 的快速反馈）。
          # -m 同样覆盖 addopts 里的 "not integration"，在其上追加 not network。
          pytest -m "not integration and not network" --maxfail=0
