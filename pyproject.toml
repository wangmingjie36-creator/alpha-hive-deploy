[project]
name = "alpha-hive"
version = "4.0.0"
description = "Decentralized swarm-intelligence investment research agent cluster"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    # v0.33.0: 30→60s。部分非-integration 测试打真实 API 偏慢（dashboard 渲染 42s、
    # options 分析 32s），30s 下限流时确定性超时；60s 实测整套 0 失败（durations 验证）。
    "--timeout=60",
    "-x",
    # v0.33.0: 默认跳过 integration（需真实网络/OAuth 的外部依赖测试，离线必挂）。
    # 跑它们：pytest -m integration（CLI 的 -m 覆盖此处）。
    "-m", "not integration",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    # v0.45.165：口径从「外部 API」扩到「本机以外拿不到的东西」——
    # 也包含**生产产物**（`pheromone.db` / `cache/` / `.swarm_results_*`，
    # 全部命中 .gitignore ⇒ 干净检出与 CI 上不存在）。核对生产数据本身有没有
    # 退化的测试换夹具就测不到它要测的东西，只能标 marker 显式 opt-in；
    # 关键是**别写成 skip**：marker 在默认摘要里是 `N deselected`（可见），
    # skip 只在 `-rs` 时吐一行、平时和 PASSED 一样是个点。
    "integration: needs external APIs **or** production artifacts absent from a clean checkout; excluded by addopts, run with -m integration",
    # v0.45.94: 打真实外部端点（yfinance / Treasury / CNN）因而**结果不确定**的测试。
    # 与 integration 的区别是意图：integration 测的是「对接外部系统这件事本身」，
    # network 测的是本地逻辑、只是恰好在路径上碰了网络。
    # **刻意不加进 addopts 的默认排除**——本机有网，这些测试照常跑、照常有价值；
    # 只有 CI 用 `-m "not integration and not network"` 把它们摘掉换取确定性。
    "network: hits live external endpoints; excluded in CI (run locally with -m network)",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "test_*.py", "setup_*.py", "alpha_hive_app.py"]

[tool.coverage.report]
show_missing = true
fail_under = 40

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long
    "E402",   # module-level import not at top
    "F401",   # unused import
    "F541",   # f-string without placeholders
    "F841",   # unused variable (many in except blocks)
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    "E741",   # ambiguous variable name
]
